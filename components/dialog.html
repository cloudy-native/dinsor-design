<!-- Open with dialog.showModal(). Only one primary button inside. -->
<dialog aria-labelledby="dlg-title">
  <h2 id="dlg-title">Delete this item?</h2>
  <p class="lede">This cannot be undone.</p>
  <form method="dialog" class="row">
    <button class="btn primary">Delete</button>
    <button class="btn ghost">Cancel</button>
  </form>
</dialog>
